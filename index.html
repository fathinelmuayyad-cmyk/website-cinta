<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9ecf,#ffe6f2);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    position:relative;
}

h1{
    color:#ff4081;
    margin-bottom:20px;
}

p{
    font-size:20px;
    margin-bottom:30px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

#yes{
    background:#ff4081;
    color:white;
}

#yes:hover{
    transform:scale(1.15);
}

#no{
    background:#ddd;
    color:black;
    position:absolute;
}

.heart{
    position:absolute;
    color:red;
    animation:fall 5s linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100vh);
opacity:1;
}
100%{
transform:translateY(100vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<h1>❤️ Hai Kamu ❤️</h1>

<p>Maukah kamu menjadi seseorang yang spesial untukku?</p>

<button id="yes">Iya ❤️</button>
<button id="no">Belum 😊</button>

</div>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");

no.style.left="240px";
no.style.top="190px";

no.addEventListener("mouseover",()=>{

const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-70);

no.style.position="fixed";
no.style.left=x+"px";
no.style.top=y+"px";

});

yes.onclick=()=>{

document.body.innerHTML=`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff5ea8,#ffc0cb);
flex-direction:column;
color:white;
font-family:Arial;
text-align:center;
">
<h1 style="font-size:55px;">❤️ Yeay!! ❤️</h1>
<h2>Terima kasih sudah menerima perasaanku 😊</h2>
<h3>Semoga ini menjadi awal cerita yang indah.</h3>
</div>
`;

};

setInterval(()=>{

const h=document.createElement("div");

h.className="heart";
h.innerHTML="❤";

h.style.left=Math.random()*window.innerWidth+"px";
h.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

},200);

</script>

</body>
</html>
